<style>
.report-actions,.report-controls,.report-views{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:12px 0}
.report-actions button,.report-views button{font:inherit;font-size:13px;padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--white);color:var(--blue);cursor:pointer}
body.dark .report-actions button,body.dark .report-views button{color:var(--onyx)}body.dark .report-views button.active{background:#2e3175;color:white}
.report-actions button:disabled{opacity:.5;cursor:default}.report-views button.active{background:var(--blue);color:white}
.report-controls label{display:flex;flex-direction:column;gap:5px;flex:1;min-width:130px;font-size:12px;color:var(--muted)}
.report-controls input,.report-controls select,.report-controls textarea{font:inherit;font-size:14px;width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--white);color:var(--onyx)}
.report-controls .notes-field{flex-basis:100%}.report-table-wrap{overflow-x:auto}.report-table{width:100%;border-collapse:collapse;font-size:13px}
.report-table th,.report-table td{padding:10px;text-align:right;border-bottom:1px solid var(--border)}.report-table th:first-child,.report-table td:first-child{text-align:left;min-width:110px}
.report-table th{background:var(--snow);font-size:11px}.report-table td{font-variant-numeric:tabular-nums}.report-table th,.report-table td{white-space:nowrap}.report-table th:first-child,.report-table td:first-child{white-space:normal;overflow-wrap:break-word}
.report-help{font-size:12px;color:var(--muted);margin:8px 0}.report-totals{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.report-total{flex:1;min-width:100px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--white)}.report-total span{display:block;font-size:11px;color:var(--muted)}.report-total strong{display:block;font-size:19px;margin-top:4px}
.chair-paper{padding:16px}.chair-paper dl{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0}.chair-paper dt{font-size:12px;color:var(--muted)}.chair-paper dd{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.chair-paper .chair-notes{grid-column:1/-1}.report-badge{font-size:11px;padding:4px 8px;border-radius:20px;background:var(--snow);border:1px solid var(--border)}.report-preview-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin:12px 0}.report-review{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;background:var(--snow);border:1px solid var(--border);border-radius:10px}.report-stock-date{font-size:12px;color:var(--muted);margin-bottom:10px}
@media(max-width:640px){.report-table th,.report-table td{padding:8px 3px;font-size:10px}.report-table th:first-child,.report-table td:first-child{min-width:64px}}
@media(max-width:480px){.report-actions button{flex:1}.report-total strong{font-size:17px}}
</style>
<script>
var requestedReportMode=null, reportMode='orders', reportMonth='', availableMonths=[], reportYear='', reportPeriod='monthly', reportView='group', reportGroup='';
var ordersReportData=null, chairData=null, chairPreview=null;
var reportWindowMonth='', reportRequest=0, chairSendPending=false, chairWritePending=false, chairPreviewSequence=0, chairDirty=false, chairDisplay='draft', chairPreferredDisplay=null, chairSaveTimer=null, chairSaveAgain=false, chairSaveWaiters=[];
const REPORT_MONTH_NAMES=['January','February','March','April','May','June','July','August','September','October','November','December'];
function reportMonthInput(label){const p=String(label).split(' '), i=REPORT_MONTH_NAMES.indexOf(p[0]);return i<0?'':p[1]+'-'+String(i+1).padStart(2,'0');}
function reportMonthLabel(value){const p=String(value).split('-');return p.length===2&&Number(p[1])>=1&&Number(p[1])<=12?REPORT_MONTH_NAMES[Number(p[1])-1]+' '+p[0]:'';}
function reportMoney(n){return '$'+Number(n||0).toFixed(2);}
function reportOption(value,label,selected){return '<option value="'+esc(value)+'"'+(value===selected?' selected':'')+'>'+esc(label)+'</option>';}
function reportCanLeave(go,stay){
  // Edits autosave, so leaving only asks when a change could not be saved.
  if(reportMode!=='chair'||!chairData||(!chairDirty&&!chairWritePending&&!chairSaveTimer)){go();return;}
  chairAutosave(ok=>{if(ok)go();else showConfirm('Your latest changes could not be saved. Leave anyway and lose them?','Leave',go,stay);});
}
// The reports open on the current ordering window's month. A page left open across a meeting keeps its old month, so
// every visit asks the server which window is current and, if it moved on, switches to the new month once.
function followReportWindow(){
  const mode=reportMode;
  google.script.run.withSuccessHandler(r=>{
    if(!r||!r.valid||!reportMonthInput(r.meetingMonth))return;
    meetingMonth=r.meetingMonth;
    if(!reportWindowMonth||reportWindowMonth===r.meetingMonth){reportWindowMonth=r.meetingMonth;return;}
    if(reportMode!==mode||chairWritePending||dashboardSignedOut)return; // try again on the next visit
    reportWindowMonth=r.meetingMonth;reportMonth=r.meetingMonth;reportYear=reportMonth.split(' ')[1];renderReportsShell();fetchReport();
  }).withFailureHandler(()=>{}).resumeSession(sessionToken);
}
function loadReports(){
  reportMode=requestedReportMode||'orders';requestedReportMode=null;
  if(!reportMonthInput(reportMonth)){const n=new Date();reportMonth=reportMonthInput(meetingMonth)?meetingMonth:REPORT_MONTH_NAMES[n.getMonth()]+' '+n.getFullYear();if(reportMonthInput(meetingMonth))reportWindowMonth=meetingMonth;}
  reportYear=reportYear||reportMonth.split(' ')[1];chairDirty=false;
  renderReportsShell();fetchReport();
  google.script.run.withSuccessHandler(months=>{availableMonths=Array.isArray(months)?months:[];if(reportMode==='orders')renderOrdersControls();}).withFailureHandler(()=>{}).getAvailableMonths(sessionToken);
  followReportWindow();
}
function renderReportsShell(){
  document.getElementById('reports-content').innerHTML='<div style="padding-top:16px"><div class="report-mode-tabs">'+
    [['orders','Orders'],['trends','Trends'],['chair','Chair Report']].map(([key,label])=>'<button class="report-mode-tab'+(reportMode===key?' active':'')+'" onclick="setReportMode(\''+key+'\')">'+label+'</button>').join('')+
    '</div><div id="report-controls"></div><div id="report-panel"></div><div id="footer-reports"></div></div>';
}
function setReportMode(mode){
  if(!['orders','trends','chair'].includes(mode))return;
  reportCanLeave(()=>{reportMode=mode;chairDirty=false;renderReportsShell();fetchReport();});
}
function onReportMonthChange(value){
  const month=reportMonthLabel(value)||value;
  const revert=()=>{const input=document.getElementById('report-month');if(input)input.value=reportMonthInput(reportMonth);};
  if(!reportMonthInput(month)){revert();return;}
  reportCanLeave(()=>{reportMonth=month;reportYear=month.split(' ')[1];if(reportMode==='orders')reportGroup='';chairDirty=false;fetchReport();},revert);
}
function changeOrdersPeriod(value){if(value==='annual')reportYear=reportMonth.split(' ')[1];else if(reportPeriod==='annual')reportMonth=reportMonth.split(' ')[0]+' '+reportYear;reportPeriod=value;reportGroup='';fetchReport();}
function changeOrdersYear(value){reportYear=value;reportGroup='';fetchReport();}
function setOrdersView(view){reportView=view;renderOrdersControls();renderOrdersResults();}
function changeReportGroup(value){reportGroup=value;fetchReport();}
function renderOrdersControls(){
  const years=[...new Set(availableMonths.map(m=>m.split(' ').pop()).concat([reportYear,String(new Date().getFullYear())]))].filter(y=>/^\d{4}$/.test(y)).sort().reverse();
  const groups=ordersReportData?ordersReportData.groups:reportGroup?[reportGroup]:[];
  document.getElementById('report-controls').innerHTML='<div class="report-controls"><label>Period<select onchange="changeOrdersPeriod(this.value)">'+reportOption('monthly','Monthly',reportPeriod)+reportOption('annual','Annual',reportPeriod)+'</select></label>'+
    (reportPeriod==='annual'?'<label>Year<select onchange="changeOrdersYear(this.value)">'+years.map(y=>reportOption(y,y,reportYear)).join('')+'</select></label>':'<label>Month<input id="report-month" type="month" value="'+reportMonthInput(reportMonth)+'" onchange="onReportMonthChange(this.value)"></label>')+
    '<label>Group<select onchange="changeReportGroup(this.value)">'+reportOption('','All groups',reportGroup)+groups.map(g=>reportOption(g,g,reportGroup)).join('')+'</select></label></div>'+
    '<div class="report-views"><button class="'+(reportView==='group'?'active':'')+'" onclick="setOrdersView(\'group\')">By Group</button><button class="'+(reportView==='item'?'active':'')+'" onclick="setOrdersView(\'item\')">By Item</button></div>';
}
function fetchReport(){
  const request=++reportRequest,mode=reportMode;chairPreview=null;chairPreviewSequence++;
  ordersReportData=null;chairData=null;
  if(mode==='orders')renderOrdersControls();else document.getElementById('report-controls').innerHTML='';
  if(mode==='trends'){document.getElementById('report-panel').innerHTML='<div id="trends-view"></div>';openTrends();return;}
  document.getElementById('report-panel').innerHTML='<div class="spinner"><div class="spin"></div>Loading...</div>';
  const runner=google.script.run.withSuccessHandler(data=>{
    if(request!==reportRequest||mode!==reportMode||dashboardSignedOut)return;
    if(!data||data.error){document.getElementById('report-panel').textContent=data&&data.error||'Could not load report.';return;}
    viewsLoaded.reports=true;
    if(mode==='orders'){ordersReportData=data;renderOrdersControls();renderOrdersResults();}
    else{chairData=data;chairDirty=false;clearTimeout(chairSaveTimer);chairSaveAgain=false;chairDisplay=chairPreferredDisplay&&data.finalized?chairPreferredDisplay:'draft';chairPreferredDisplay=null;renderChairReport();}
  }).withFailureHandler(e=>{if(request===reportRequest)document.getElementById('report-panel').textContent=e.message;});
  if(mode==='orders')runner.getOrdersReport(reportPeriod,reportPeriod==='annual'?reportYear:reportMonth,reportGroup,sessionToken);
  else runner.getChairReport(reportMonth,sessionToken);
}
function fetchSpecialReport(){fetchReport();}
// The Trends button on the Inventory tab is a shortcut: Trends itself lives in the Reports tab.
function openTrendsShortcut(){requestedReportMode='trends';switchView('reports');}
// On-screen tables use short column names on narrow phones so the whole table fits; print and CSV keep the full names.
const SHORT_HEADERS={'Requested':'Req.','Fulfilled':'Filled','Estimated Value':'Est.','Fulfilled Value':'Filled Val.','Amount':'Amt.','Orders':'Ord.','Pending':'Pend.','Collected':'Coll.','Charged to H&I':'H&I'};
function shortHeader(h){return (typeof window!=='undefined'&&window.innerWidth<=640&&SHORT_HEADERS[h])||h;}
function reportTable(headers,rows,onScreen){return '<div class="report-table-wrap"><table class="report-table"><thead><tr>'+headers.map(h=>'<th>'+esc(onScreen?shortHeader(h):h)+'</th>').join('')+'</tr></thead><tbody>'+(rows.length?rows.map(r=>'<tr>'+r.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+headers.length+'">No records</td></tr>')+'</tbody></table></div>';}
function ordersTableData(){
  const d=ordersReportData;
  if(reportView==='item')return {headers:['Item','Requested','Fulfilled','Estimated Value','Fulfilled Value'],rows:d.items.map(i=>[i.name,i.requested,i.fulfilled,reportMoney(i.estimated),reportMoney(i.fulfilledValue)])};
  if(d.period==='annual')return {headers:['Group','Orders','Requested','Fulfilled','Estimated Value','Pending','Collected',...(hasCharged()?['Charged to H&I']:[])],rows:d.byGroup.map(g=>[g.groupName,g.orderCount,g.requested,g.fulfilled,reportMoney(g.estimated),reportMoney(g.pending),reportMoney(g.collected),...(hasCharged()?[reportMoney(g.charged)]:[])])};
  return {headers:['Group','Order','Status','Requested','Fulfilled','Estimated Value','Amount'],rows:d.orders.map(o=>[o.groupName,o.orderId,o.status,o.requested,o.fulfilled,reportMoney(o.estimated),reportMoney(o.amount)])};
}
function ordersMonthData(){return {headers:['Month','Orders','Requested','Fulfilled','Estimated Value','Pending','Collected',...(hasCharged()?['Charged to H&I']:[])],rows:ordersReportData.months.map(m=>[m.month,m.orderCount,m.requested,m.fulfilled,reportMoney(m.estimated),reportMoney(m.pending),reportMoney(m.collected),...(hasCharged()?[reportMoney(m.charged)]:[])])};}
// H&I Subcommittee orders are charged to its budget, so that figure only appears once there is something to show.
function hasCharged(){return !!(ordersReportData&&ordersReportData.totals&&ordersReportData.totals.charged>0);}
function ordersTotalsHTML(){const t=ordersReportData.totals;return '<div class="report-totals">'+[['Collected',t.collected],...(hasCharged()?[['Charged to H&I',t.charged]]:[]),['Pending',t.pending],['Estimated Value',t.estimated]].map(([label,n])=>'<div class="report-total"><span>'+label+'</span><strong>'+reportMoney(n)+'</strong></div>').join('')+'</div>';}
function packWarning(d){return d&&d.unknownPackLines&&d.unknownPackLines.length?' WARNING: '+d.unknownPackLines.length+' order line(s) have no saved pack size (Order Items column I) and are counted as single items.':'';}
function ordersHelp(){return (reportView==='item'?'Fulfilled Value includes Ready and Completed.':'Pending: New estimates + Ready amounts. Collected: Completed.')+(hasCharged()?' Charged to H&I: Completed H&I Subcommittee orders, paid from its budget (not collected).':'')+' Quantities represent individual items, except readings, which are counted as sets. Orders and totals include the H&I Subcommittee, which is not a group.'+packWarning(ordersReportData);}
function renderOrdersResults(){
  if(!ordersReportData)return;
  const table=ordersTableData(),months=ordersMonthData();
  document.getElementById('report-panel').innerHTML=ordersTotalsHTML()+'<div class="report-actions"><button onclick="printOrdersReport()">Print / PDF</button><button onclick="exportOrdersCSV()">CSV</button></div><p class="report-help">'+ordersHelp()+'</p>'+reportTable(table.headers,table.rows,true)+
    (ordersReportData.period==='annual'?'<details style="margin-top:16px"><summary>Monthly breakdown</summary>'+reportTable(months.headers,months.rows,true)+'</details>':'');
}
function ordersTitle(){return 'Orders - '+(reportView==='item'?'By Item':'By Group');}
function ordersPeriodLabel(){return ordersReportData.selection+(ordersReportData.group?' | '+ordersReportData.group:' | All groups');}
function printOrdersReport(){if(!ordersReportData)return;const t=ordersTableData(),m=ordersMonthData();printReportPage(ordersTitle(),'<h1>NORVANA</h1><h2>'+ordersTitle()+'</h2><p>'+esc(ordersPeriodLabel())+'</p>'+ordersTotalsHTML()+'<p>'+ordersHelp()+'</p>'+reportTable(t.headers,t.rows)+(ordersReportData.period==='annual'?'<h3>Monthly breakdown</h3>'+reportTable(m.headers,m.rows):''));}
function ordersCSVRows(){const d=ordersReportData,t=ordersTableData(),m=ordersMonthData();return [['NORVANA',ordersTitle()],['Period',d.selection],['Group',d.group||'All groups'],['Collected',d.totals.collected],...(hasCharged()?[['Charged to H&I',d.totals.charged]]:[]),['Pending',d.totals.pending],['Estimated Value',d.totals.estimated],[ordersHelp()],[],t.headers,...t.rows,...(d.period==='annual'?[[],['Monthly breakdown'],m.headers,...m.rows]:[])];}
function exportOrdersCSV(){if(ordersReportData)downloadReportCSV('NORVANA '+ordersTitle()+' '+ordersReportData.selection,ordersCSVRows());}
// -- Inventory Print / Export (opened from the Inventory tab) --
// Counts, targets and suggested orders are all in singles, the unit Catalog stock is kept in.
// Target Stock is Low At plus one order multiple (the Pack Size, or the Catalog's optional Order Multiple, or 1). Only low (yellow) or out (red) items get a
// Suggested Order = Target Stock - On Hand, rounded up to whole packs. Incoming (already ordered) stock is not tracked.
// Order on Request items (a product switched to it in the Catalog sheet) have no counts or targets, so they are never
// reported as low, out or missing stock; they sort after the stocked items in their category.
function isOnRequestItem(i){return i.inventoryType==='Order on Request';}
function inventoryStatusLabel(onHand,lowAt){const low=isNaN(parseFloat(lowAt))?5:Number(lowAt);return onHand<=0?'Out of stock':onHand<=low?'Low stock':'In stock';}
function inventoryCategoryOrder(categories){
  const known=(typeof CAT_ORDER!=='undefined'?CAT_ORDER:[]).filter(c=>categories.includes(c));
  return known.concat(categories.filter(c=>!known.includes(c)));
}
// items: live values [{itemId,category,name,stock,lowAt,packSize,targetStock}]; options: {categories:null|[names], include:'all'|'reorder'}
function inventoryReportModel(items,options){
  const wanted=options.categories&&options.categories.length?options.categories:null;
  const base=typeof itemSortScore==='function'?items.slice().sort((a,b)=>itemSortScore(a)-itemSortScore(b)):items;
  const sorted=base.filter(i=>!isOnRequestItem(i)).concat(base.filter(isOnRequestItem));
  const cats=inventoryCategoryOrder([...new Set(items.map(i=>i.category||'Other'))]).filter(c=>!wanted||wanted.includes(c));
  const groups=cats.map(cat=>({category:cat,rows:sorted.filter(i=>(i.category||'Other')===cat).map(i=>{
    const onRequest=isOnRequestItem(i),onHand=Number(i.stock)||0,pack=Number(i.orderMultiple)>0?Number(i.orderMultiple):Number(i.packSize)||1;
    if(onRequest)return {itemId:i.itemId,name:i.name,pack:pack,onHand:null,target:null,suggested:null,packs:null,status:'On request',needsTarget:false,onRequest:true};
    const target=i.targetStock===null||i.targetStock===undefined||i.targetStock===''?null:Number(i.targetStock);
    const status=inventoryStatusLabel(onHand,i.lowAt);
    let suggested=target===null?null:Math.max(0,target-onHand);
    if(suggested>0&&pack>1)suggested=Math.ceil(suggested/pack)*pack;
    if(suggested!==null&&status==='In stock')suggested=0;
    return {itemId:i.itemId,name:i.name,pack:pack,onHand:onHand,target:target,suggested:suggested,
      packs:suggested>0&&pack>1?Math.ceil(suggested/pack):null,status:status,needsTarget:target===null&&status!=='In stock',onRequest:false};
  }).filter(r=>options.include!=='reorder'||(!r.onRequest&&(r.suggested>0||r.needsTarget)))})).filter(g=>g.rows.length);
  const needTarget=groups.reduce((n,g)=>n+g.rows.filter(r=>r.needsTarget).length,0);
  const onRequestCount=groups.reduce((n,g)=>n+g.rows.filter(r=>r.onRequest).length,0);
  return {groups:groups,needTarget:needTarget,onRequestCount:onRequestCount,allCategories:inventoryCategoryOrder([...new Set(items.map(i=>i.category||'Other'))])};
}
function inventoryScopeText(model,options){
  const picked=options.categories&&options.categories.length&&options.categories.length<model.allCategories.length;
  return 'Categories: '+(picked?options.categories.join(', '):'All categories')+' | Items: '+(options.include==='reorder'?'Items to reorder':'All items');
}
function inventorySuggestedText(r){
  if(r.onRequest)return '-';
  if(r.target===null)return 'Set target';
  if(r.pack>1&&r.suggested>0)return r.suggested+' ('+r.packs+(r.packs===1?' pack':' packs')+' of '+r.pack+')';
  return String(r.suggested);
}
function inventoryPrintHTML(model,meta){
  const left='style="text-align:left"';
  const head='<tr><th '+left+'>Item #</th><th '+left+'>Item Name</th><th>On Hand</th><th>Target Stock</th><th>Suggested Order</th><th>Stock Status</th></tr>';
  const tables=model.groups.map(g=>'<h3 style="margin:18px 0 6px;font-size:14px">'+esc(g.category)+'</h3><table class="report-table" style="table-layout:fixed"><colgroup><col style="width:11%"><col style="width:31%"><col style="width:11%"><col style="width:12%"><col style="width:20%"><col style="width:15%"></colgroup><thead>'+head+'</thead><tbody>'+
    g.rows.map(r=>'<tr><td '+left+'>'+esc(r.itemId)+'</td><td '+left+'>'+esc(r.name)+(r.pack>1?'<br><small>Pack of '+r.pack+' - counts are in singles</small>':'')+'</td><td>'+(r.onRequest?'-':r.onHand)+'</td><td>'+(r.onRequest?'-':r.target===null?'':r.target)+'</td><td>'+esc(inventorySuggestedText(r))+'</td><td>'+(r.status==='In stock'||r.onRequest?esc(r.status):'<strong>'+esc(r.status.toUpperCase())+'</strong>')+'</td></tr>').join('')+'</tbody></table>').join('')||'<p>No items match this selection.</p>';
  return '<h2>NORVANA Literature Inventory</h2><p>Generated: '+esc(meta.generated)+'<br>'+esc(meta.scope)+'</p>'+
    '<p style="font-size:12px">All counts are in singles (individual items). Target Stock is one above the item\'s Low At level (one whole pack above for pack items). Suggested Order = Target Stock - On Hand, rounded up to whole packs, for low and out of stock items only.'+(model.needTarget?' "Set target" marks '+model.needTarget+' low or out item'+(model.needTarget===1?'':'s')+' with no target.':'')+(model.onRequestCount?' Order on request items are ordered only when someone asks for them, so On Hand, Target Stock and Suggested Order do not apply to them.':'')+'</p>'+tables;
}
function inventoryCSVRows(model,meta){
  return [['NORVANA Literature Inventory'],['Generated',meta.generated],['Scope',meta.scope],['All counts are in singles. Target Stock is one above Low At (one pack above for pack items). Suggested Order = Target Stock - On Hand, in whole packs, for low and out of stock items.'],[],
    ['Category','Item #','Item Name','On Hand','Target Stock','Suggested Order','Stock Status','Order Unit','Suggested Packs','Inventory Type'],
    ...model.groups.flatMap(g=>g.rows.map(r=>[g.category,r.itemId,r.name,r.onRequest?'':r.onHand,r.onRequest||r.target===null?'':r.target,r.onRequest?'':r.target===null?'Set target':r.suggested,r.status,r.pack>1?'Pack of '+r.pack+' (counts are singles)':'Single items',r.packs===null?'':r.packs,r.onRequest?'Order on Request':'Stocked']))];
}
function createInventoryReport(items,options,output){
  const model=inventoryReportModel(items,options),now=new Date(),meta={generated:now.toLocaleString(),scope:inventoryScopeText(model,options)};
  if(output==='csv')downloadReportCSV('NORVANA Literature Inventory '+now.toISOString().slice(0,10),inventoryCSVRows(model,meta));
  else printReportPage('Literature Inventory',inventoryPrintHTML(model,meta));
  return model;
}
function downloadReportCSV(title,rows){
  const csv=rows.map(r=>r.map(v=>'"'+String(typeof v==='string'&&/^[=+\-@]/.test(v)?"'"+v:v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=title+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function printReportPage(title,html){
  const w=window.open('','_blank');if(!w){alert('Allow pop-ups to print.');return;}
  w.document.write('<!doctype html><html><head><title>NORVANA '+esc(title)+'</title><style>body{font:14px Arial,sans-serif;color:#202044;padding:24px;line-height:1.5}h1{font-size:14px}h2{font-size:20px}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:7px;border-bottom:1px solid #ddd;text-align:right}th:first-child,td:first-child{text-align:left}thead{display:table-header-group}tr{break-inside:avoid}dt{font-weight:bold;margin-top:12px}dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.report-totals{display:flex;gap:24px;margin:16px 0}.report-total span,.report-total strong{display:block}.report-badge{font-size:12px}@media print{button{display:none}body{padding:0}.report-table-wrap{overflow:visible}}@page{margin:12mm}</style></head><body>'+html+'<p><button onclick="window.print()">Print / Save as PDF</button></p></body></html>');w.document.close();
}
function chairPaperHTML(r){return '<div class="chair-paper"><dl>'+(r.ordersMonth?'<div><dt>Orders recap</dt><dd>'+esc(r.ordersMonth)+'</dd></div>':'')+'<div><dt>Groups Served</dt><dd>'+r.groupsServed+'</dd></div><div><dt>Collected</dt><dd>'+reportMoney(r.moneyCollected)+'</dd></div>'+(typeof r.hiCharged==='number'?'<div><dt>H&I charged to subcommittee budget</dt><dd>'+reportMoney(r.hiCharged)+'</dd></div>':'')+'<div><dt>Spent</dt><dd>'+reportMoney(r.moneySpent)+'</dd></div><div class="chair-notes"><dt>Notes</dt><dd>'+esc(r.other||'None')+'</dd></div></dl></div>';}
function displayedChairReport(){if(chairDisplay==='final'&&chairData.finalized)return chairData.finalized;const r={...chairData.draft};if(chairDirty){r.moneySpent=Number(document.getElementById('chair-spending').value)||0;r.other=document.getElementById('chair-notes').value;}return r;}
function chairSentDate(r){return r.sentAt?new Date(r.sentAt).toLocaleDateString():'date unavailable';}
function chairStatusLabel(){return chairDisplay==='final'?'Sent version '+chairData.finalized.version+' ('+chairSentDate(chairData.finalized)+')':'Current report';}
function renderChairReport(){
  const d=chairData,r=d.draft;
  document.getElementById('report-controls').innerHTML='<div class="report-totals"><div class="report-total"><span>Groups served</span><strong>'+r.groupsServed+'</strong></div><div class="report-total"><span>Collected</span><strong>'+reportMoney(r.moneyCollected)+'</strong></div>'+(typeof r.hiCharged==='number'?'<div class="report-total"><span>H&amp;I charged</span><strong>'+reportMoney(r.hiCharged)+'</strong></div>':'')+'</div>'+(r.ordersMonth?'<div class="report-help" style="margin:6px 2px 0">Totals are from <strong>'+esc(r.ordersMonth)+'</strong> orders, picked up at that area meeting.</div>':'')+'<div class="report-controls"><label>Reporting month<input id="report-month" type="month" value="'+reportMonthInput(reportMonth)+'" onchange="onReportMonthChange(this.value)"></label><label>Spent<input id="chair-spending" type="number" min="0" step="0.01" value="'+Number(r.moneySpent).toFixed(2)+'" oninput="chairEdited()"></label><label class="notes-field">Notes<textarea id="chair-notes" rows="3" maxlength="10000" oninput="chairEdited()">'+esc(r.other)+'</textarea></label></div>'+
    '<div class="report-actions"><span id="chair-unsaved" class="report-help">'+(r.savedAt?'Saved':'')+'</span></div>';
  renderChairPreview();
}
function renderChairPreview(){
  const d=chairData,r=displayedChairReport();
  document.getElementById('report-panel').innerHTML='<div class="report-preview-head"><span class="report-badge">'+esc(chairStatusLabel())+'</span>'+
    (d.finalized?'<div class="report-actions"><button onclick="showChairVersion(\''+(chairDisplay==='final'?'draft':'final')+'\')">'+(chairDisplay==='final'?'Edit Report':'View Last Sent')+'</button></div>':'')+
    '<div class="report-actions"><button onclick="printChairUI()">Print / PDF</button><button '+(chairDisplay==='final'?'disabled title="Click Edit Report to email a new version."':'')+' onclick="previewChairUI()">Review Email</button></div></div><div class="report-card">'+chairPaperHTML(r)+'</div>';
}
function showChairVersion(version){chairDisplay=version;chairPreview=null;chairPreviewSequence++;renderChairPreview();}
function setChairStatus(text,isError){const el=document.getElementById('chair-unsaved');if(!el)return;el.textContent=text;el.style.color=isError?'#b3261e':'';el.style.fontWeight=isError?'600':'';}
function chairInputs(){const a=document.getElementById('chair-spending'),n=document.getElementById('chair-notes');if(!a||!n)return null;const amount=a.value;return{amount:amount,notes:n.value,valid:amount!==''&&Number.isFinite(Number(amount))&&Number(amount)>=0};}
function chairEdited(){
  const i=chairInputs();if(!i)return;
  chairDirty=!i.valid||Number(i.amount)!==Number(chairData.draft.moneySpent)||i.notes!==chairData.draft.other;
  chairDisplay='draft';chairPreview=null;chairPreviewSequence++;
  clearTimeout(chairSaveTimer);chairSaveTimer=null;
  if(!i.valid)setChairStatus('Enter an amount to save.',true);
  else if(chairDirty){setChairStatus('Saving...');chairSaveTimer=setTimeout(()=>chairAutosave(),700);}
  else setChairStatus('Saved');
  renderChairPreview();
}
function chairFlushWaiters(ok){const w=chairSaveWaiters;chairSaveWaiters=[];w.forEach(f=>f(ok));}
function chairAutosave(done){
  clearTimeout(chairSaveTimer);chairSaveTimer=null;
  if(done)chairSaveWaiters.push(done);
  if(chairWritePending){chairSaveAgain=true;return;}
  const i=chairInputs(),month=reportMonth;
  if(!i||reportMode!=='chair'||!chairData){chairFlushWaiters(false);return;}
  if(!i.valid){setChairStatus('Enter an amount to save.',true);chairFlushWaiters(false);return;}
  if(chairData.draft.savedAt&&Number(i.amount)===Number(chairData.draft.moneySpent)&&i.notes===chairData.draft.other){chairDirty=false;chairFlushWaiters(true);return;}
  chairWritePending=true;setChairStatus('Saving...');
  const finish=r=>{
    chairWritePending=false;
    if(reportMode!=='chair'||reportMonth!==month||!chairData){chairFlushWaiters(false);return;}
    if(!r.success){chairSaveAgain=false;setChairStatus('NOT SAVED: '+r.error+' Your changes are not stored. Reload this report.',true);chairFlushWaiters(false);return;}
    chairData.revision=r.revision;
    chairData.draft={...chairData.draft,moneySpent:Number(i.amount),other:i.notes,savedAt:r.savedAt};
    const now=chairInputs();chairDirty=!!now&&(Number(now.amount)!==Number(i.amount)||now.notes!==i.notes);
    if(chairSaveAgain||chairDirty){chairSaveAgain=false;chairAutosave();return;}
    setChairStatus('Saved');chairFlushWaiters(true);
  };
  google.script.run.withSuccessHandler(finish).withFailureHandler(e=>finish({success:false,error:e.message})).saveChairDraft(reportMonth,Number(i.amount),i.notes,chairData.revision,sessionToken);
}
function printChairUI(){const r=displayedChairReport();printReportPage('Chair Report','<h1>NORVANA</h1><h2>Chair Report</h2><p>'+esc(r.reportingMonth)+' | '+esc(chairStatusLabel())+(chairDisplay==='draft'&&chairDirty?' | Unsaved changes':'')+'</p>'+chairPaperHTML(r));}

function reopenFromPanel() {
  const oid = currentOrderId, order = allOrders.find(o => o.orderId === oid), btn = document.getElementById('reopen-btn');
  if (!order || !btn || btn.disabled) return;
  showConfirm('Reopen this Ready order? Its packed quantities will return to available stock. No email is sent until it is marked Ready again.', 'Reopen', () => runReopenOrder(oid, order, btn));
}
function runReopenOrder(oid, order, btn) {
  if (btn.disabled) return;
  btn.disabled = true;
  google.script.run.withSuccessHandler(result => {
    if (!result.success) { btn.disabled = false; alert(result.error); return; }
    order.status = 'New'; order.revision = result.revision; order.fulfilledTotal = 0;
    clearFulfillDraft(oid); viewsLoaded.inventory = false; viewsLoaded.reports = false;
    updateStats(); renderOrderList(); if (currentOrderId === oid) openOrder(oid);
    showToast('Order reopened. Previous quantities are ready to edit.');
  }).withFailureHandler(e => { btn.disabled = false; alert(e.message); }).reopenOrder(oid, sessionToken, order.revision);
}

function chairEmailSummary(email) {
  if (!email) return '';
  const date = value => value ? new Date(value).toLocaleString() : 'date unavailable';
  let text;
  if (email.status === 'accepted' || email.status === 'sent') {
    text = 'Sent date (accepted for sending): ' + date(email.acceptedAt || email.at) + '. Recipient: ' + email.recipient + '. Delivery is not confirmed.';
  } else if (email.status === 'failed') {
    text = 'Send failed before contacting the email service. Retry Send is available after reviewing the report.';
  } else {
    text = 'Sending outcome is uncertain. The email may have sent. Check sent mail before choosing Retry Send.';
  }
  if (email.status !== 'accepted' && email.status !== 'sent' && email.lastAccepted) text += ' Last accepted for sending: ' + date(email.lastAccepted.at) + ' to ' + email.lastAccepted.recipient + '. Delivery is not confirmed.';
  return text;
}
// The email review and Send button live in a popup so the report page stays uncluttered.
function openChairEmail() { var m = document.getElementById('chair-email-modal'); if (m && m.classList) m.classList.add('open'); }
function closeChairEmail() {
  var m = document.getElementById('chair-email-modal'); if (m && m.classList) m.classList.remove('open');
  chairPreview = null; chairPreviewSequence++;
  var p = document.getElementById('chair-email-preview'); if (p) p.textContent = '';
}
function previewChairUI() {
  if (chairSendPending || !chairData || chairDisplay === 'final') return;
  const month = reportMonth, sequence = ++chairPreviewSequence;
  chairPreview = null;
  openChairEmail();
  document.getElementById('chair-email-preview').textContent = 'Saving and loading email review...';
  chairAutosave(saved => {
    if (reportMode !== 'chair' || reportMonth !== month || sequence !== chairPreviewSequence) return;
    if (!saved) { document.getElementById('chair-email-preview').textContent = 'Enter a valid Spent amount and make sure it saved before reviewing the email.'; return; }
    requestChairEmailPreview(month, sequence);
  });
}
function requestChairEmailPreview(month, sequence) {
  google.script.run.withSuccessHandler(r => {
    if (reportMode !== 'chair' || reportMonth !== month || sequence !== chairPreviewSequence) return;
    if (!r.success) { document.getElementById('chair-email-preview').textContent = r.error; return; } chairPreview = r;
    const label = r.action === 'resend' ? 'Resend' : r.action === 'retry' ? 'Retry Send' : 'Send';
    document.getElementById('chair-email-preview').innerHTML = '<h3>Email</h3><p>To: <strong>' + esc(r.recipient) + '</strong><br>Subject: ' + esc(r.subject) + '</p>' +
      (r.previousEmail ? '<p class="report-help">' + esc(chairEmailSummary(r.previousEmail)) + '</p>' : '') +
      '<div class="report-review">' + esc(r.body) + '</div><div class="report-actions"><button id="chair-send" onclick="sendChairUI()">' + label + '</button></div>';
  }).withFailureHandler(e => { if (reportMode === 'chair' && reportMonth === month && sequence === chairPreviewSequence) document.getElementById('chair-email-preview').textContent = e.message; }).previewChairEmail(month, sessionToken);
}
function sendChairUI() {
  if (!chairPreview || chairSendPending) return;
  const preview = chairPreview, month = reportMonth;
  let prompt = 'Send this report to ' + preview.recipient + ' and save it to Google Sheets?';
  if (preview.action === 'resend') prompt = 'A previous report email was accepted for sending. Intentionally resend this report to ' + preview.recipient + '? It will be saved as a new version, and the earlier version is kept.';
  if (preview.action === 'retry') prompt = preview.previousEmail && preview.previousEmail.status === 'failed' ?
    'Retry sending this report to ' + preview.recipient + '?' :
    'The previous email may have sent. Check sent mail before continuing. After checking, do you want to explicitly retry to ' + preview.recipient + '? This may create another copy.';
  showConfirm(prompt, preview.action === 'resend' ? 'Resend' : preview.action === 'retry' ? 'Retry Send' : 'Send', () => {
    if (chairSendPending || chairPreview !== preview) return; // The preview changed while the question was open.
    submitChairSend(preview, month);
  });
}
function submitChairSend(preview, month) {
  chairSendPending = true; chairPreview = null; chairPreviewSequence++;
  const button = document.getElementById('chair-send'); if (button) { button.disabled = true; button.textContent = 'Sending...'; }
  google.script.run.withSuccessHandler(r => {
    chairSendPending = false;
    closeChairEmail();
    alert(r.success ? r.message : r.error);
    if (r.success) chairPreferredDisplay = 'final';
    if (reportMode === 'chair' && reportMonth === month && !chairDirty && !chairWritePending) fetchSpecialReport();
  }).withFailureHandler(e => {
    chairSendPending = false;
    closeChairEmail();
    alert('The send response was lost or failed. The email may have sent. Check sent mail, then review the report before an explicit Retry Send.');
    if (reportMode === 'chair' && reportMonth === month && !chairDirty && !chairWritePending) fetchSpecialReport();
  }).sendChairReport(preview.previewId, sessionToken, preview.action);
}

</script>
