<style>
#trends-view .tr-back{background:none;border:none;color:var(--blue);font:inherit;font-size:13px;cursor:pointer;padding:12px 0 4px}
body.dark #trends-view .tr-back{color:var(--lime)}
#trends-view .tr-title{font-size:20px;font-weight:600;color:var(--onyx);margin:6px 0 4px}
#trends-view .tr-sub{font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.5}
#trends-view .tr-controls{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
#trends-view .tr-controls label{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#trends-view .tr-controls select{font:inherit;font-size:14px;font-weight:400;letter-spacing:0;text-transform:none;padding:10px;border:1.5px solid var(--border);border-radius:10px;background:var(--white);color:var(--onyx);width:100%;box-sizing:border-box}
#trends-view .tr-badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--lime);color:#1a1a3e;border-radius:999px;padding:3px 9px;margin-left:8px;vertical-align:middle}
#trends-view .tr-notice{background:var(--snow);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13px;margin:0 0 12px;line-height:1.5;color:var(--onyx)}
#trends-view .tr-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 14px}
@media(min-width:700px){#trends-view .tr-cards{grid-template-columns:repeat(4,1fr)}}
body.dark #trends-view .tr-bar{background:var(--lime)}
#trends-view .tr-card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
#trends-view .tr-card.lead{border-color:var(--blue)}
#trends-view .tr-card span{display:block;font-size:11px;color:var(--muted)}
#trends-view .tr-card strong{display:block;font-size:20px;margin-top:3px;color:var(--onyx);font-variant-numeric:tabular-nums}
#trends-view .tr-card small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
#trends-view .tr-chart{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:14px 12px 10px;margin:0 0 14px}
#trends-view .tr-chart h3{font-size:13px;font-weight:700;margin:0 0 10px;color:var(--onyx)}
#trends-view .tr-bars{display:flex;align-items:flex-end;gap:8px;height:150px}
#trends-view .tr-col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
#trends-view .tr-bar{width:100%;max-width:56px;background:var(--blue);opacity:.45;border-radius:6px 6px 0 0;min-height:2px}
#trends-view .tr-col.sel .tr-bar{opacity:1}
#trends-view .tr-val{font-size:12px;font-weight:600;color:var(--onyx);margin-bottom:3px;font-variant-numeric:tabular-nums}
#trends-view .tr-labels{display:flex;gap:8px;margin-top:6px}
#trends-view .tr-labels div{flex:1;text-align:center;font-size:11px;color:var(--muted)}
#trends-view .tr-labels div.sel{color:var(--onyx);font-weight:700}
#trends-view .tr-tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--white)}
#trends-view .tr-table{width:100%;border-collapse:collapse;font-size:13px}
#trends-view .tr-table th{background:var(--snow);font-size:11px;text-align:right;padding:9px 10px;border-bottom:1px solid var(--border);color:var(--muted);white-space:nowrap}
#trends-view .tr-table th:first-child,#trends-view .tr-table td:first-child{text-align:left;min-width:150px;white-space:normal}
#trends-view .tr-table td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;color:var(--onyx);font-variant-numeric:tabular-nums;white-space:nowrap}
#trends-view .tr-table td.dist{font-weight:700}
#trends-view .tr-table tr.cat td{background:var(--blue-pale);color:var(--blue);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:left}
body.dark #trends-view .tr-table tr.cat td{color:var(--lime)}
#trends-view .tr-table tr.total td{font-weight:700;background:var(--snow)}
#trends-view .tr-empty{padding:18px 12px;text-align:center;font-size:14px;color:var(--muted)}
#trends-view .tr-msg.error{color:var(--danger);font-weight:600;font-size:13px;margin:10px 0}
</style>
<script>
// Trends: distribution over time, calculated by the server from the order records on every open.
var trends = { data: null, scope: 'all', loading: false, error: '', request: 0 };

function trEl() { return document.getElementById('trends-view'); }

function trReset() {
  trends.data = null; trends.scope = 'all'; trends.loading = false; trends.error = ''; trends.request++;
  var box = trEl(), inv = document.getElementById('inventory-content');
  if (box) { box.style.display = 'none'; box.innerHTML = ''; }
  if (inv) inv.style.display = '';
}

function openTrends() {
  var box = trEl(), inv = document.getElementById('inventory-content');
  if (!box) return;
  if (inv) inv.style.display = 'none';
  box.style.display = '';
  trends.data = null; trends.scope = 'all';
  trLoad('');
}

function trLoad(month) {
  var request = ++trends.request;
  trends.loading = true; trends.error = '';
  trRender();
  google.script.run
    .withSuccessHandler(function(data) {
      if (request !== trends.request || dashboardSignedOut) return;
      trends.loading = false;
      if (!data || data.success === false || data.error) { trends.error = (data && data.error) || 'Could not load trends.'; trRender(); return; }
      trends.data = data;
      if (!trScopeExists(trends.scope)) trends.scope = 'all';
      trRender();
    })
    .withFailureHandler(function() {
      if (request !== trends.request || dashboardSignedOut) return;
      trends.loading = false; trends.error = 'Could not load trends. Check your connection and try again.'; trRender();
    })
    .getTrendsReport(month, sessionToken);
}

function trScopeExists(scope) {
  var d = trends.data;
  if (scope === 'all' || !d) return true;
  if (scope.indexOf('c:') === 0) return d.categories.indexOf(scope.slice(2)) >= 0;
  return d.items.some(function(i) { return 'i:' + i.itemId === scope; });
}

function trRows() {
  var d = trends.data, s = trends.scope;
  if (!d) return [];
  if (s.indexOf('c:') === 0) return d.items.filter(function(i) { return i.category === s.slice(2); });
  if (s.indexOf('i:') === 0) return d.items.filter(function(i) { return 'i:' + i.itemId === s; });
  return d.items;
}

function trNum(n) { return n == null ? '-' : String(Math.round(n * 10) / 10); }
function trMoney(n) { return '$' + Number(n || 0).toFixed(2); }
function trShort(label) { var p = String(label).split(' '); return p[0].slice(0, 3) + (p[1] ? ' \u2019' + p[1].slice(2) : ''); }
function trCat(name) { return name === 'Spanish Lit' ? 'Spanish' : name; }

function trSeriesTotals(rows) {
  return trends.data.months.map(function(m, i) { return rows.reduce(function(sum, r) { return sum + (Number(r.series[i]) || 0); }, 0); });
}

function trScopeOptions() {
  var d = trends.data, html = '<option value="all"' + (trends.scope === 'all' ? ' selected' : '') + '>All literature</option>';
  d.categories.forEach(function(cat) {
    html += '<optgroup label="' + esc(trCat(cat)) + '"><option value="c:' + esc(cat) + '"' + (trends.scope === 'c:' + cat ? ' selected' : '') + '>All ' + esc(trCat(cat)) + '</option>';
    d.items.filter(function(i) { return i.category === cat; }).forEach(function(i) {
      html += '<option value="i:' + esc(i.itemId) + '"' + (trends.scope === 'i:' + i.itemId ? ' selected' : '') + '>' + esc(i.name) + '</option>';
    });
    html += '</optgroup>';
  });
  return html;
}

function trChartHTML(series, months) {
  var max = Math.max.apply(null, series.concat([1])), last = series.length - 1;
  var title = 'Distributed per month (picked up)';
  return '<div class="tr-chart"><h3>' + title + '</h3><div class="tr-bars">' + series.map(function(v, i) {
    return '<div class="tr-col' + (i === last ? ' sel' : '') + '"><div class="tr-val">' + trNum(v) + '</div><div class="tr-bar" style="height:' + Math.round(v / max * 100) + '%"></div></div>';
  }).join('') + '</div><div class="tr-labels">' + months.map(function(m, i) {
    return '<div class="' + (i === last ? 'sel' : '') + '">' + esc(trShort(m)) + '</div>';
  }).join('') + '</div></div>';
}

function trTableHTML(rows) {
  if (!rows.length) return '<div class="tr-tablewrap"><div class="tr-empty">No orders for this selection yet.</div></div>';
  var d = trends.data, html = '<div class="tr-tablewrap"><table class="tr-table"><thead><tr><th>Item</th><th>Distributed</th><th>' + (d.prevMonth ? esc(trShort(d.prevMonth)) : 'Last month') + '</th><th>' + (d.avgMonths ? d.avgMonths + '-mo avg' : 'Avg') + '</th><th>Requested</th><th>Value</th></tr></thead><tbody>';
  var cat = null;
  rows.forEach(function(r) {
    if (r.category !== cat) { cat = r.category; html += '<tr class="cat"><td colspan="6">' + esc(trCat(cat)) + '</td></tr>'; }
    html += '<tr><td>' + esc(r.name) + '</td><td class="dist">' + trNum(r.distributed) + '</td><td>' + trNum(r.prev) + '</td><td>' + trNum(r.avg) + '</td><td>' + trNum(r.requested) + '</td><td>' + trMoney(r.value) + '</td></tr>';
  });
  return html + '</tbody></table></div>';
}

function trRender() {
  var box = trEl(), d = trends.data;
  if (!box || dashboardSignedOut) return;
  var html = '<button type="button" class="tr-back" onclick="closeTrends()">&larr; Inventory</button><div class="tr-title">Trends</div>'
    + '<div class="tr-sub">What groups picked up each month, and how it compares with earlier months.</div>';
  if (trends.error) html += '<div class="tr-msg error" role="alert">' + esc(trends.error) + '</div>';
  if (!d) { box.innerHTML = html + (trends.loading ? '<div class="spinner"><div class="spin"></div>Loading trends...</div>' : ''); return; }
  var rows = trRows(), series = trSeriesTotals(rows), last = series.length - 1, n = d.avgMonths;
  var sum = function(key) { return rows.reduce(function(total, r) { return total + (Number(r[key]) || 0); }, 0); };
  var prev = d.prevMonth ? series[last - 1] : null;
  var avg = n ? series.slice(last - n, last).reduce(function(a, b) { return a + b; }, 0) / n : null;
  html += '<div class="tr-controls"><label>Month<select onchange="trLoad(this.value)"' + (trends.loading ? ' disabled' : '') + '>'
    + d.availableMonths.map(function(m) { return '<option value="' + esc(m) + '"' + (m === d.month ? ' selected' : '') + '>' + esc(m) + '</option>'; }).join('')
    + '</select></label><label>Show<select onchange="trSetScope(this.value)">' + trScopeOptions() + '</select></label></div>';
  html += '<div class="tr-notice"><strong>' + esc(d.month) + '</strong>' + (d.monthToDate ? '<span class="tr-badge">Month to date</span>' : '')
    + '<br>' + (d.monthToDate ? 'Orders waiting for pickup are not counted yet, so Distributed looks low until they are picked up. ' : '')
    + 'Distributed counts picked-up orders only. '
    + (n ? 'Average of the ' + n + ' earlier month' + (n === 1 ? '' : 's') + ' since tracking began (' + esc(d.startMonth) + ').' : 'No earlier months since tracking began (' + esc(d.startMonth) + ').') + '</div>';
  html += '<div class="tr-cards">'
    + '<div class="tr-card lead"><span>Distributed</span><strong>' + trNum(series[last]) + '</strong><small>' + trMoney(sum('value')) + ' value</small></div>'
    + '<div class="tr-card"><span>' + (d.prevMonth ? esc(d.prevMonth) : 'Last month') + '</span><strong>' + trNum(prev) + '</strong><small>distributed</small></div>'
    + '<div class="tr-card"><span>' + (n ? n + '-month average' : 'Average') + '</span><strong>' + trNum(avg) + '</strong><small>distributed per month</small></div>'
    + '<div class="tr-card"><span>Requested</span><strong>' + trNum(sum('requested')) + '</strong><small>' + esc(d.month) + '</small></div></div>';
  html += trChartHTML(series, d.months) + trTableHTML(rows);
  box.innerHTML = html;
}

function trSetScope(value) { trends.scope = value; trRender(); }
function closeTrends() { trReset(); }
</script>
